@if(errorLogin()) {
    <div class="alert alert-danger w-25 position-fixed top-2 start-50 translate-middle-x d-flex justify-content-between" role="alert">
        {{ errorLogin() }}
        <button type="button" class="btn-close" (click)="errorLogin.set('')"></button>
    </div>
}
<div class="container-fluid d-flex justify-content-center align-items-center" style="height: 60vh;">
    <div class="card" style="width: 25%; height: 70%; border-color: #292827c4;">
        <div class="card-header d-flex justify-content-center align-items-center" style="height: 30%; background-color: #4a0404;">
            <h2 class="card-title" style="color: #ffffff;">Iniciar Sesión</h2>
        </div>
        <div class="card-body d-flex flex-column align-items-center">
            <form style="width: 90%;" class="d-flex flex-column">
                <label for="email" class="form-label fs-5" style="color: #ffffff;">Usuario</label>
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon1">@</span>
                    <input type="email" name="username" class="form-control" id="email" [(ngModel)]="userName" placeholder="Ingrese su nombre de usuario">
                </div>
                <label for="password" class="form-label fs-5" style="color: #ffffff;">Contraseña</label>
                <div class="input-group mb-3">
                    @if (btnPass) {
                        <span class="input-group-text" id="basic-addon1" (click)="buttonPass()" style="cursor: pointer;"><svg width="24px" height="24px" viewBox="0 0 24 24" stroke-width="1.5" fill="none" xmlns="http://www.w3.org/2000/svg" color="#000000"><path d="M19.5 16L17.0248 12.6038" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12 17.5V14" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M4.5 16L6.96895 12.6124" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3 8C6.6 16 17.4 16 21 8" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
                    } @else {
                        <span class="input-group-text" id="basic-addon1" (click)="buttonPass()" style="cursor: pointer;"><svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="#000000" stroke-width="1.5"><path d="M3 13C6.6 5 17.4 5 21 13" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12 17C10.3431 17 9 15.6569 9 14C9 12.3431 10.3431 11 12 11C13.6569 11 15 12.3431 15 14C15 15.6569 13.6569 17 12 17Z" fill="#000000" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
                    }
                    <input [type]="btnPass ? 'text' : 'password'" name="pass" class="form-control" id="password" [(ngModel)]="password" placeholder="Ingrese su contraseña">
                </div>
                <!-- <button type="submit" class="btn btn-primary ms-auto" routerLink="/inventory">Iniciar sesión</button> -->
                <button type="submit" style="background-color: #4a0404; border-color: #4a0404;" class="btn btn-primary ms-auto" (click)="login()">Iniciar sesión</button>
            </form>
        </div>
    </div>
</div>
