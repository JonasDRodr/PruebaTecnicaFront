<div class="d-flex mt-3 justify-content-center gap-3" style="color: #ffffff;">
    <label for="">Por favor seleccione una encuesta</label>
    <select class="form-select w-auto" [(ngModel)]="idEncuesta" (ngModelChange)="TraerEncuesta($event)">
        <option value="" disabled selected>Selecciona una encuesta</option>
        <option [value]="1">Encuesta 1</option>
        <option [value]="2">Encuesta 2</option>
    </select>
    @if (errorLogin()) {
        <div class="alert alert-danger py-2 w-auto d-inline-block">
        {{ errorLogin() }}
        </div>
    }

    @if (successMsg()) {
    <div class="alert alert-success py-2 w-auto d-inline-block">
        {{ successMsg() }}
    </div>
    }
</div>

@if (showEncuesta()) {
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
    
          <div class="card shadow-sm">
            <div class="card-body p-4">
    
              <h2 class="fw-bold mb-1">{{ nombreEncuesta() }}</h2>
              <p class="text-muted mb-4">Responde del 1 al 10 las siguientes preguntas.</p>
    
            @for (pregunta of preguntasEncuesta(); track $index) {
                <div class="mb-4">
                  <label class="form-label fw-semibold">
                    {{ $index + 1 }}. {{ pregunta.texto }}
                  </label>
                  <div class="d-flex align-items-center gap-3">
                    <span class="text-muted small">1</span>
                    <input type="range" class="form-range flex-grow-1" min="1" max="10" [(ngModel)]="pregunta.valorSeleccionado"/>
                    <span class="text-muted small">10</span>
                    <span class="badge bg-primary fs-6" style="min-width: 2.5rem;">
                      {{ pregunta.valorSeleccionado }}
                    </span>
                  </div>
                </div>
            }
    
    
              <div class="d-flex justify-content-end mt-3">
                <button
                  class="btn btn-primary px-4"
                  (click)="enviarRespuestas()">
                  Enviar respuestas
                </button>
              </div>
    
            </div>
          </div>
    
        </div>
      </div>
    </div>
}
